<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الصفحة الشخصية والمنشورات العلمية لعباس. ملفات ومقالات أكاديمية وعلمية في الطب والعلوم.">
    <title>Bio</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Google Fonts for premium Arabic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Prevent browser caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- FontAwesome for modern social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Dynamic cache-busting for local assets -->
    <script>
        document.write('<link rel="stylesheet" href="style.css?v=' + new Date().getTime() + '">');
    </script>
</head>
<body>
    <!-- Background Image Overlay -->
    <div class="bg-image"></div>

    <div class="container">
        <!-- Logo Section -->
        <header class="header">
            <div class="logo-wrapper">
                <!-- Tries to load logo.png, falls back to SVG on error -->
                <img src="logo.png" alt="الشعار" class="logo-image" id="logo-img" onerror="handleLogoError()">
                
                <div id="logo-fallback" class="logo-svg-fallback">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
                        <defs>
                            <!-- Linear gradients for premium metallic look -->
                            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff" />
                                <stop offset="50%" stop-color="#e0e0e0" />
                                <stop offset="100%" stop-color="#9e9e9e" />
                            </linearGradient>
                            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="6" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <!-- Mortar and Pestle Bowl -->
                        <path d="M120,170 C120,230 280,230 280,170 C280,165 120,165 120,170 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M150,217 L250,217" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
                        
                        <!-- Pestle -->
                        <line x1="140" y1="130" x2="165" y2="175" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
                        
                        <!-- Asclepius Snake wrapping around a central staff -->
                        <!-- Staff -->
                        <line x1="200" y1="90" x2="200" y2="175" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
                        <!-- Snake -->
                        <path d="M185,160 Q200,145 215,160 T200,180 T185,150 Q200,120 215,130 T200,105" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                        <!-- Snake head -->
                        <path d="M195,105 C195,100 205,100 205,105 Z" fill="#ffffff" />
                        
                        <!-- Arabic calligraphy text "أسكليبيوس" recreated in SVG paths -->
                        <text x="200" y="65" font-family="'Cairo', sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">أَسْكِلِيبْيُوسْ</text>
                    </svg>
                </div>
            </div>
            
            <h1 class="name">Abbas J.K. Dherish</h1>
            
            <!-- Social Links Chips -->
            <div class="social-chips">
                <a href="javascript:void(0)" class="chip telegram-chip" id="social-telegram">
                    <i class="fab fa-telegram-plane"></i>
                    <span>تيليجرام</span>
                </a>
                <a href="javascript:void(0)" class="chip whatsapp-chip" id="social-whatsapp">
                    <i class="fab fa-whatsapp"></i>
                    <span>واتساب</span>
                </a>
                <a href="javascript:void(0)" class="chip email-chip" id="social-email">
                    <i class="far fa-envelope"></i>
                    <span>البريد الإلكتروني</span>
                </a>
            </div>
        </header>

        <!-- Main Publications Section -->
        <main class="publications-section">
            <h2 class="section-title">منشوراتي</h2>
            
            <!-- Publications Dynamic Container -->
            <div class="publications-list" id="pubs-list">
                <!-- Skeleton Loader (shows while loading XML) -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </main>
        <!-- Platform Section -->
        <section class="publications-section" style="margin-top: 40px;">
            <h2 class="section-title">منصتي</h2>
            <div style="display: flex; justify-content: center; align-items: center; width: 100%; gap: 12px; flex-wrap: wrap;">
                <a href="mgDar/mgDar.apk" download class="chip mgdar-chip" style="font-size: 1rem; padding: 12px 24px;">
                    <img src="mgdar_icon.png" alt="مگدار" style="width: 1.25em; height: 1.25em; object-fit: contain; border-radius: 20%;">
                    <span style="font-weight: 700;">مگدار</span>
                </a>
                <a href="https://t.me/PhThespian" target="_blank" class="chip telegram-chip" style="font-size: 1rem; padding: 12px 24px;">
                    <i class="fab fa-telegram-plane"></i>
                    <span style="font-family: var(--font-english); font-weight: 600;" dir="ltr">• 𝘗𝘩𝘢𝘳𝘮𝘢 𝘛𝘩𝘦𝘴𝘱𝘪𝘢𝘯 “制药演员”</span>
                </a>
            </div>
        </section>
        
        <!-- Footer -->
        <footer class="footer">
            <p> </p>
        </footer>
    </div>
    
    <!-- PDF Viewer Modal -->
    <div id="pdf-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">عرض الملف</h3>
                <span class="close-button" id="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <iframe id="pdf-viewer" src="" frameborder="0"></iframe>
            </div>
            <div class="modal-footer">
                <a id="pdf-download-btn" href="" download class="download-btn">
                    <i class="fas fa-download"></i> تحميل
                </a>
            </div>
        </div>
    </div>
    <script>
        document.write('<script src="script.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    <script>
        // Handle current year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Safe fallback toggle for logo image vs svg
        function handleLogoError() {
            const img = document.getElementById('logo-img');
            const fallback = document.getElementById('logo-fallback');
            if (img) img.style.display = 'none';
            if (fallback) fallback.style.display = 'block';
        }
    </script>
</body>
</html>
