name: Deploy Bio Site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'pubs/**'
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'generate_xml.py'
      - 'logo.png'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Publications XML
        run: |
          python generate_xml.py

      - name: Commit updated XML (if changed)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add publications.xml
          # Commit only if there are changes to commit, otherwise exit cleanly
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-regenerated publications.xml [skip ci]"
          
      # Force-push the committed XML back to the repository so the main branch stays updated
      - name: Push changes (if any)
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
